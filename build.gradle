plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
	}
	maven {
		name = 'Polyfrost'
		url = 'https://repo.polyfrost.cc/releases'
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"obs_rec_indicator" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional — compileOnly so the jar never requires OneConfig at runtime.
	// Extracted API modules from OneConfig 1.2.0 (26.3 Fabric). Not bundled into the mod jar.
	// "hud" provides the HUD API (the indicator is a OneConfig HUD when OneConfig is installed),
	// "26.3-fabric" is OneConfig's platform module for Minecraft 26.3, the version this mod targets,
	// "poly-compose" supplies PolyColor, the colour type OneConfig colour options use.
	compileOnly files(
		"libs/oneconfig-config-1.2.0.jar",
		"libs/oneconfig-config-impl-1.2.0.jar",
		"libs/oneconfig-hud-1.2.0.jar",
		"libs/oneconfig-26.3-fabric-1.2.0.jar",
		"libs/kotlin-stdlib-2.1.0.jar",
		"libs/poly-compose-1.2.0.jar"
	)

	// Hud.Content() takes an androidx.compose.runtime.Composer, so that one type has to be on the
	// compile classpath. OneConfig ships the compose runtime itself at runtime; this is compileOnly
	// so nothing of it is ever bundled into the mod jar.
	// No transitives: only the Compose interfaces are needed to compile against, never to run.
	compileOnly("org.jetbrains.compose.runtime:runtime-desktop:1.8.2") {
		transitive = false
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
